name: Release collector

# A version tag builds and checks the collector natively on each architecture,
# then creates a draft release. Publishing the draft is a manual step.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  SPINEL_REVISION: 66ae8c07f2d94f86f31fe7902650e796a79895fc
  MAXMIND_VERSION: 1.12.2
  MAXMIND_COMMIT: cba618d6581b7dbe83478c798d9e58faeaa6b582
  # Gems that Spinel's `make deps` would fetch unverified; versions match its Makefile.
  PRISM_VERSION: 1.9.0
  PRISM_SHA256: 7b530c6a9f92c24300014919c9dcbc055bf4cdf51ec30aed099b06cd6674ef85
  RBS_VERSION: 4.0.1
  RBS_SHA256: e237fd49787fb265bf0f389f2f0f5788fdcdf1f49bb54b4f7952cea904162a07

jobs:
  build:
    strategy:
      matrix:
        include:
          # Ubuntu 22.04 fixes the glibc 2.35 baseline for both binaries.
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(jq -r .version manifest.json)" = "$version"
          test "$(uname -m)" = "${{ matrix.arch }}"

      - name: Prepare Spinel and libmaxminddb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake
          tools="$RUNNER_TEMP/tools"
          git clone https://github.com/matz/spinel.git "$tools/spinel"
          git -C "$tools/spinel" checkout --detach "$SPINEL_REVISION"
          # Vendor the parser gems after checking their digests, so `make deps` has nothing to fetch.
          fetch_gem() {
            curl -fsSL --max-filesize 20000000 -o "$RUNNER_TEMP/$1.gem" "https://rubygems.org/gems/$1-$2.gem"
            echo "$3  $RUNNER_TEMP/$1.gem" | sha256sum -c -
            mkdir -p "$tools/spinel/vendor/$1" "$RUNNER_TEMP/$1-gem"
            tar -xf "$RUNNER_TEMP/$1.gem" -C "$RUNNER_TEMP/$1-gem" data.tar.gz
            tar -xzf "$RUNNER_TEMP/$1-gem/data.tar.gz" -C "$tools/spinel/vendor/$1"
          }
          fetch_gem prism "$PRISM_VERSION" "$PRISM_SHA256"
          fetch_gem rbs "$RBS_VERSION" "$RBS_SHA256"
          test -f "$tools/spinel/vendor/prism/include/prism/diagnostic.h"
          test -f "$tools/spinel/vendor/rbs/include/rbs/parser.h"
          make -C "$tools/spinel" -q deps
          make -C "$tools/spinel" -j"$(nproc)"
          git clone --depth 1 --branch "$MAXMIND_VERSION" https://github.com/maxmind/libmaxminddb.git "$tools/maxmind"
          test "$(git -C "$tools/maxmind" rev-parse HEAD)" = "$MAXMIND_COMMIT"
          cmake -S "$tools/maxmind" -B "$tools/maxmind/build" \
            -DBUILD_TESTING=OFF -DMAXMINDDB_BUILD_BINARIES=OFF \
            -DCMAKE_INSTALL_PREFIX="$tools/maxmind-install"
          cmake --build "$tools/maxmind/build" -j"$(nproc)"
          cmake --install "$tools/maxmind/build"
          echo "SPINEL=$tools/spinel/bin/spinel" >> "$GITHUB_ENV"
          echo "MAXMIND_PREFIX=$tools/maxmind-install" >> "$GITHUB_ENV"
          echo "TOOLS=$tools" >> "$GITHUB_ENV"

      - name: Build and check
        run: |
          backend/ruby/build.sh --force
          backend/ruby/check.sh

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="outbound-engine-$version-linux-${{ matrix.arch }}"
          package="$RUNNER_TEMP/$name"
          mkdir -p "$package/licenses"
          install -m755 backend/ruby/build/outbound-engine "$package/outbound-engine"
          cp LICENSE "$package/LICENSE"
          cp "$TOOLS/spinel/LICENSE" "$package/licenses/spinel-LICENSE"
          cp "$TOOLS/maxmind/LICENSE" "$package/licenses/libmaxminddb-LICENSE"
          cp "$TOOLS/maxmind/NOTICE" "$package/licenses/libmaxminddb-NOTICE"
          # Only glibc libraries present on every target distribution.
          extra=$(objdump -p "$package/outbound-engine" | awk '/NEEDED/ {print $2}' |
            grep -Ev '^(libc|libm)\.so\.6$|^ld-linux' || true)
          if [ -n "$extra" ]; then echo "Unexpected shared libraries: $extra" >&2; exit 1; fi
          glibc=$(objdump -T "$package/outbound-engine" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          cat > "$package/NOTICE.txt" <<EOF
          Outbound collector $version for Linux ${{ matrix.arch }} (requires $glibc or newer).
          Built from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY at commit $GITHUB_SHA.
          Outbound code: MIT (LICENSE).
          Compiled with Spinel $SPINEL_REVISION: MIT (licenses/spinel-LICENSE).
          Statically links libmaxminddb $MAXMIND_VERSION: Apache-2.0 (licenses/libmaxminddb-*).
          No GeoIP database is included.
          EOF
          tar -C "$RUNNER_TEMP" --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@$(git log -1 --format=%ct)" -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "$name ($glibc): $(cut -d' ' -f1 "$name.tar.gz.sha256")" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-${{ matrix.arch }}
          path: outbound-engine-*.tar.gz*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: engine-*
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The pinned checksums for tools/engine-release.json, ready to commit.
          jq -n --arg version "$version" '{version: $version, assets: {}}' > release.json
          for arch in x86_64 aarch64; do
            name="outbound-engine-$version-linux-$arch.tar.gz"
            sha=$(cut -d' ' -f1 "$name.sha256")
            jq --arg arch "$arch" --arg name "$name" --arg sha "$sha" \
              '.assets[$arch] = {name: $name, sha256: $sha}' release.json > release.next
            mv release.next release.json
          done
          cat outbound-engine-*.sha256 > SHA256SUMS
          {
            echo "Prebuilt collector for Linux x86_64 and aarch64."
            echo
            echo "Before publishing, commit this as \`tools/engine-release.json\` on main:"
            echo
            echo '```json'
            cat release.json
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "Outbound $version" --notes-file notes.md \
            outbound-engine-*.tar.gz SHA256SUMS
